name: Continuous Deployment

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Infrastructure Deployment Pipeline"]
    types:
      - completed
    branches: [ main ]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ca-central-1
  IMAGE_TAG: latest

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      backend-image: ${{ steps.images.outputs.backend-image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('data-pipeline/requirements.txt', 'app/requirements.txt') }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r data-pipeline/requirements.txt
          pip install -r app/requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-cd

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1
        with:
          mask-password: true

      - name: Build and Push ETL Docker image
        run: |
          ECR_ETL_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/etl:${{ env.IMAGE_TAG }}
          docker buildx build \
            --platform linux/amd64 \
            -t $ECR_ETL_URI \
            -f data-pipeline/docker/Dockerfile \
            --push \
            data-pipeline

      - name: Build and Push Backend Docker image
        run: |
          ECR_BACKEND_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/genai-app:${{ env.IMAGE_TAG }}
          docker buildx build \
            --platform linux/amd64 \
            -t $ECR_BACKEND_URI \
            -f app/Dockerfile \
            --push \
            app

      - name: Set image outputs
        id: images
        run: |
          echo "etl-image=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/etl:${{ env.IMAGE_TAG }}" >> $GITHUB_OUTPUT
          echo "backend-image=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/genai-app:${{ env.IMAGE_TAG }}" >> $GITHUB_OUTPUT

  deploy-dags:
    name: Deploy DAGs to MWAA
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-cd

      - name: Sync DAGs to S3
        run: |
          aws s3 sync data-pipeline/dags s3://${{ secrets.MWAA_DAGS_BUCKET }}/dags \
            --delete

  deploy-backend:
    name: Deploy Backend Lambda
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    env:
      BACKEND_LAMBDA_FUNCTION_NAME: ${{ secrets.BACKEND_LAMBDA_FUNCTION_NAME }}
      BACKEND_LAMBDA_ALIAS: ${{ secrets.BACKEND_LAMBDA_ALIAS }}
    outputs:
      function-url: ${{ steps.function_url.outputs.function_url }}
      function-version: ${{ steps.publish.outputs.version }}
    steps:
      - name: Validate backend deployment configuration
        run: |
          if [ -z "$BACKEND_LAMBDA_FUNCTION_NAME" ]; then
            echo "Missing BACKEND_LAMBDA_FUNCTION_NAME secret for backend deployment." >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-backend-cd

      - name: Update Lambda function image
        env:
          BACKEND_IMAGE_URI: ${{ needs.build-and-push.outputs.backend-image }}
        run: |
          aws lambda update-function-code \
            --function-name "$BACKEND_LAMBDA_FUNCTION_NAME" \
            --image-uri "$BACKEND_IMAGE_URI"
          aws lambda wait function-updated --function-name "$BACKEND_LAMBDA_FUNCTION_NAME"

      - name: Publish new Lambda version
        id: publish
        run: |
          VERSION=$(aws lambda publish-version \
            --function-name "$BACKEND_LAMBDA_FUNCTION_NAME" \
            --query 'Version' \
            --output text)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update Lambda alias
        if: env.BACKEND_LAMBDA_ALIAS != ''
        run: |
          aws lambda update-alias \
            --function-name "$BACKEND_LAMBDA_FUNCTION_NAME" \
            --name "$BACKEND_LAMBDA_ALIAS" \
            --function-version "${{ steps.publish.outputs.version }}"

      - name: Fetch Function URL
        id: function_url
        run: |
          URL=$(aws lambda get-function-url-config \
            --function-name "$BACKEND_LAMBDA_FUNCTION_NAME" \
            --query 'FunctionUrl' \
            --output text)
          echo "function_url=$URL" >> "$GITHUB_OUTPUT"

  deploy-ui:
    name: Deploy UI to CloudFront
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-dags, deploy-backend]
    if: github.ref == 'refs/heads/main'
    env:
      BACKEND_FUNCTION_URL: ${{ needs.deploy-backend.outputs.function-url }}
    steps:
      - uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and build UI
        working-directory: ui
        env:
          VITE_BACKEND_URL: ${{ env.BACKEND_FUNCTION_URL }}
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-cd

      - name: Upload UI assets to S3
        run: |
          aws s3 sync ui/dist s3://${{ secrets.UI_BUCKET_NAME }} \
            --delete \
            --cache-control "public, max-age=31536000" \
            --exclude "index.html"
          aws s3 cp ui/dist/index.html s3://${{ secrets.UI_BUCKET_NAME }}/index.html \
            --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.UI_DISTRIBUTION_ID }} \
            --paths "/*"
